[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "worlds-data-harness"
version = "0.1.0"
description = "Consultas locales verificables del calendario de Worlds 2026"
requires-python = ">=3.11"
dependencies = ["tzdata==2026.5"]

[project.scripts]
worlds-data-harness = "worlds_data_harness.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: consulta optativa a la fuente real, excluida de la ejecución normal"]
